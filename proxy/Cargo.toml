[package]
name = "appproxy-traefik-proxy"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
description.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
traefik_wasm_api = { path = "../traefik_wasm_api" }
appproxy_traefik_lib = { path = "../lib" }
sha2 = "0.10.8"
hmac = "0.12.1"
hex-literal = "0.4.1"
base64 = "0.22.1"
urlencoding = "2.1.3"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.3"
