name: ci

on:
  push:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip:ci') && github.event.pull_request.merged == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_FETCH_DEPTH }}
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          target: wasm32-wasip1
      - name: Lint and format
        uses: actions-rust-lang/rustfmt@v1
  build-wasm:
    needs: [lint]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_FETCH_DEPTH }}
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          target: wasm32-wasip1
      - name: Build WASM
        run: make release
      - name: Create plugin folder structure
        run: |
          mkdir -p plugins-local/src/backend.ai/appproxy-traefik-plugin
          cp pkg/* plugins-local/src/backend.ai/appproxy-traefik-plugin
          tar cvzf appproxy-traefik-plugin.tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: appproxy-traefik-plugin.tar.gz
  make-final-release:
    needs: [build-wasm]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: dist
      - name: Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            dist/*
